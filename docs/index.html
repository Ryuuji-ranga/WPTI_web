  .gauge-box {

  @media (prefers-color-scheme: dark) { .gauge-box { background: rgba(58,28,42,.94); } }

    display: block;
    height: 100%;

  .gauge-count { font-weight: 900; color: var(--berry-deep); min-width: 4.6em; text-align: right; font-variant-numeric: tabular-nums; }

  .card:nth-child(6n+3) { background: var(--mint);     transform: rotate(-0.8deg); }
  .card:nth-child(6n+4) { background: var(--butter);   transform: rotate(1.8deg); }
  .card:nth-child(6n+5) { background: var(--sky);      transform: rotate(-1.2deg); }
  .card:nth-child(6n)   { background: var(--peach);    transform: rotate(0.9deg); }
  .card:hover { transform: rotate(0) scale(1.04); }
  .card .no {
    position: absolute;
    top: -14px;
    left: 12px;
    min-width: 46px;
    height: 34px;
    padding: 0 12px;
    display: grid;
    place-items: center;

    bottom: 8px;
    font-size: 1.15rem;
    opacity: .35;
    transition: opacity .2s, transform .2s;
  }
  .card.loved .pop { opacity: 1; animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(.4); } 60% { transform: scale(1.7); } 100% { transform: scale(1); } }

  .card.last {
    grid-column: 1 / -1;
    min-height: 170px;
    font-size: clamp(1.2rem, 4vw, 1.8rem);
    background: var(--berry);
    color: #fff;
    transform: rotate(0);

  <button class="btn" id="random" type="button">ランダムで1つ見る</button>
</header>

<div class="gauge-wrap">

</div>

<main>

</main>

<footer>
  <span class="big">全部で100個！。まだまだ増やしていくよ！</span>

</dialog>

  const grid = document.getElementById("grid");
  const bar = document.getElementById("bar");
  const countEl = document.getElementById("count");
  const total = reasons.length;
  const seen = new Set();

  reasons.forEach((text, i) => {
    const n = i + 1;
    const li = document.createElement("li");
    li.className = "card" + (n === total ? " last" : "");
    li.tabIndex = 0;
    li.dataset.n = n;
    li.setAttribute("role", "button");
    li.setAttribute("aria-label", n + "個目 " + text);
    li.innerHTML = '<span class="no">' + n + '</span>' + text + '<span class="pop" aria-hidden="true">💗</span>';
    const love = () => li.classList.add("loved");
    li.addEventListener("click", love);
    li.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); love(); } });
    grid.appendChild(li);
  });

  /* ゲージ: 画面に入ったカードの最大番号まで進む */
  function update() {
    const max = seen.size ? Math.max(...seen) : 0;
    countEl.textContent = max;
    bar.style.width = (max / total * 100) + "%";
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) seen.add(Number(en.target.dataset.n)); });
    update();
  }, { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".card").forEach(c => io.observe(c));

  /* ランダム表示 */
  const dlg = document.getElementById("dlg");
  const dNo = document.getElementById("dNo");
  const dText = document.getElementById("dText");
  let last = -1;
  function showRandom() {
    let i;
    do { i = Math.floor(Math.random() * total); } while (i === last && total > 1);
    last = i;
    dNo.textContent = (i + 1) + "個目";
    dText.textContent = reasons[i];
    if (!dlg.open) dlg.showModal();
  }
  document.getElementById("random").addEventListener("click", showRandom);
  document.getElementById("again").addEventListener("click", showRandom);
  document.getElementById("close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
</script>
</body>
